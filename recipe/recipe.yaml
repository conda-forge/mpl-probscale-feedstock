schema_version: 1

context:
  version: "0.3.0"

package:
  name: mpl-probscale
  version: ${{ version }}

source:
  url: https://github.com/matplotlib/mpl-probscale/archive/v${{ version }}.tar.gz
  sha256: 154d99886925588c6acbbbc52c52c46e7a984a801898a6e1404ebfe0c3a80207

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - matplotlib-base

tests:
  - python:
      imports:
        - probscale
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "mpl-probscale: Probability scales for matplotlib"
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/matplotlib/mpl-probscale

extra:
  recipe-maintainers:
    - phobson
