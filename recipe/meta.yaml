{% set version = "0.3.0" %}

package:
  name: mpl-probscale
  version: {{ version }}

source:
  url: https://github.com/matplotlib/mpl-probscale/archive/v{{ version }}.tar.gz
  sha256: 154d99886925588c6acbbbc52c52c46e7a984a801898a6e1404ebfe0c3a80207

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - matplotlib-base
    # not really needed but the basic import imports the tests and needs this
    - pytest

test:
  requires:
    - python {{ python_min }}
  imports:
    - probscale

about:
  home: http://matplotlib.org/mpl-probscale/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Probability scales for matplotlib

extra:
  recipe-maintainers:
    - phobson
